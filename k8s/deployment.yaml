apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudheal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudheal
  template:
    metadata:
      labels:
        app: cloudheal
    spec:
      containers:
        - name: cloudheal
          image: cloudheal:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cloudheal
spec:
  selector:
    app: cloudheal
  ports:
    - port: 8000
      targetPort: 8000
