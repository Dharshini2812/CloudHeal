
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudheal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudheal
  template:
    metadata:
      labels:
        app: cloudheal
    spec:
      containers:
        - name: cloudheal
          image: cloudheal-cloudheal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
