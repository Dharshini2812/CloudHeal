
services:
  cloudheal:
    build: .
    container_name: cloudheal
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: cloudheal-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - cloudheal

  grafana:
    image: grafana/grafana:latest
    container_name: cloudheal-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
